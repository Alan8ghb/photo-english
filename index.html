<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e6fd9"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png">
<title>单词王</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;background:#fffaf0;color:#222;font-size:24px;line-height:1.4}
header{background:#1e6fd9;color:#fff;padding:18px 16px;font-size:30px;font-weight:bold;display:flex;align-items:center;gap:12px;padding-top:max(18px,env(safe-area-inset-top))}
header button{background:none;border:none;color:#fff;font-size:30px;padding:0 8px}
main{padding:16px;max-width:700px;margin:auto}
.big{display:block;width:100%;min-height:80px;font-size:28px;font-weight:bold;border:none;border-radius:18px;margin:12px 0;color:#fff;background:#1e6fd9}
.green{background:#1a9b4b}.gray{background:#888}.orange{background:#e07b00}
.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 8px #0001}
.rec{display:flex;align-items:center;gap:10px}.rec .info{flex:1}.rec .d{font-size:20px;color:#666}
.known{background:#f2f2f2;color:#555;border:2px solid #ccc;border-radius:14px;font-size:22px;padding:12px 16px;min-height:56px}.known.on{background:#e8f5e9;border-color:#1a9b4b;color:#1a9b4b}
.rowf{display:flex;align-items:center;gap:10px}.rowf>div{flex:1}
.del{background:#eee;border:none;border-radius:12px;font-size:20px;padding:12px}
.en{font-size:40px;font-weight:bold;text-align:center;margin:16px 0;word-break:break-word}.en.s{font-size:30px}
.play{display:block;margin:10px auto;width:120px;height:120px;border-radius:60px;border:none;background:#ffb300;font-size:56px}
.opt{display:block;width:100%;min-height:90px;font-size:30px;border:3px solid #1e6fd9;background:#fff;border-radius:18px;margin:14px 0;padding:12px}
.opt.s{font-size:24px}.opt.right{background:#1a9b4b;color:#fff;border-color:#1a9b4b}.opt.wrong{background:#fdd;border-color:#d33}
.msg{text-align:center;font-size:30px;min-height:44px}.prog{text-align:center;color:#666}
.row{padding:10px 0;border-bottom:1px solid #eee}.row .z{color:#1e6fd9}.na{color:#aaa}
.grp{display:flex;justify-content:space-between;align-items:center;padding:0 22px;text-align:left}.gm{font-size:22px;opacity:.9}.tabs{display:flex;gap:10px}.tabs button{flex:1;font-size:24px;padding:14px;border-radius:14px;border:2px solid #1e6fd9;background:#fff}.tabs button.on{background:#1e6fd9;color:#fff}
#busy{position:fixed;inset:0;z-index:60;background:#000a;color:#fff;display:none;align-items:center;justify-content:center;font-size:30px;text-align:center;padding:20px}
#crop{position:fixed;left:0;top:0;right:0;width:100vw;height:100vh;height:100dvh;background:#000;display:none;flex-direction:column;z-index:50;overflow:hidden}
#cwrap{flex:1 1 auto;min-height:0;min-width:0;position:relative;overflow:hidden;touch-action:none}
#cimg{position:absolute;max-width:100%;max-height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#cbox{position:absolute;border:3px solid #ffeb3b;box-shadow:0 0 0 9999px #0009;touch-action:none;cursor:move}
.h{position:absolute;width:76px;height:76px;touch-action:none;display:flex;align-items:center;justify-content:center}
.h::after{content:"";width:48px;height:48px;border-radius:24px;background:#ffeb3b;border:4px solid #fff;box-shadow:0 0 6px #000}
.h.tl{left:-38px;top:-38px}.h.tr{right:-38px;top:-38px}.h.bl{left:-38px;bottom:-38px}.h.br{right:-38px;bottom:-38px}
#cbar{flex:none;display:flex;gap:10px;padding:10px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:#222;position:relative;z-index:2}
#cbar button{flex:1;min-height:80px;font-size:28px;font-weight:bold;border:none;border-radius:18px;color:#fff;background:#888}
img.prev{max-width:100%;border-radius:12px}
</style></head><body><div style="position:fixed;right:8px;bottom:6px;font-size:16px;color:#888;z-index:9">v12</div>
<header><button id="back" style="display:none" onclick="go('home')">‹</button><span id="title">单词王</span></header>
<main id="app"></main>
<div id="busy"></div>
<div id="crop"><div id="cwrap"><canvas id="cimg"></canvas><div id="cbox"><div class="h tl" data-h="tl"></div><div class="h tr" data-h="tr"></div><div class="h bl" data-h="bl"></div><div class="h br" data-h="br"></div></div></div>
<div id="cbar"><button onclick="cropBack()">重拍</button><button onclick="cropRot()">⟳</button><button onclick="cropDone(1)">全图</button><button style="background:#1a9b4b" onclick="cropDone()">确定</button></div></div>
<input id="cam" type="file" accept="image/*" capture="environment" hidden>
<input id="gal" type="file" accept="image/*" hidden>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="logic.js"></script><script src="translate.js"></script>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const load=()=>JSON.parse(localStorage.getItem('pe_records')||'[]');
const save=r=>localStorage.setItem('pe_records',JSON.stringify(r));
const K=()=>new Set(JSON.parse(localStorage.getItem('pe_known')||'[]'));
const isKnown=en=>K().has(en.toLowerCase());
function setKnown(en,on){const k=K();on?k.add(en.toLowerCase()):k.delete(en.toLowerCase());localStorage.setItem('pe_known',JSON.stringify([...k]))}
const WC=()=>JSON.parse(localStorage.getItem('pe_wrong')||'{}');
function addWrong(it){const w=WC(),k=it.type+':'+it.en.toLowerCase();w[k]=(w[k]||0)+1;localStorage.setItem('pe_wrong',JSON.stringify(w))}
// global word bank: persisted, ordered by entry seq (backfill: record date, then original word order)
function bank(){const b=JSON.parse(localStorage.getItem('pe_bank')||'{"w":{}}');if(!b.w)b.w={};delete b.s;let ch=0;
 let mx=Math.max(0,...Object.values(b.w).map(x=>x.seq||0));
 const rs=load().map((r,ri)=>({r,ri})).sort((a,c)=>a.r.date-c.r.date||c.ri-a.ri);const ord={};let n=0;
 for(const{r}of rs)(r.words||[]).forEach(it=>{const k=it.en.toLowerCase();if(!(k in ord))ord[k]=n++;const o=b.w[k];
  if(!o){b.w[k]={type:'word',en:it.en,zh:it.zh,proper:!!it.proper,date:r.date};ch=1}else if(!o.zh&&it.zh){o.zh=it.zh;ch=1}});
 const ns=Object.entries(b.w).filter(([k,x])=>!x.seq).sort(([ka,a],[kc,c])=>(a.date||0)-(c.date||0)||(ord[ka]??1e9)-(ord[kc]??1e9));
 for(const[,x]of ns){x.seq=++mx;ch=1}
 if(ch)try{localStorage.setItem('pe_bank',JSON.stringify(b))}catch(_){}return b}
const GS=20;function groups(){return Object.values(bank().w).sort((a,c)=>a.seq-c.seq).reduce((g,x,i)=>{(g[i/GS|0]=g[i/GS|0]||[]).push(x);return g},[])}
const GP=()=>JSON.parse(localStorage.getItem('pe_gprog')||'{}');
function setGP(g,v){const p=GP();p[g]=v;localStorage.setItem('pe_gprog',JSON.stringify(p))}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function busy(t){const b=$('#busy');b.style.display=t?'flex':'none';b.textContent=t||''}
function setHead(t,back){$('#title').textContent=t;$('#back').style.display=back?'':'none'}
function go(v,a){speechSynthesis.cancel();({home,recs,detail,study}[v])(a);scrollTo(0,0)}
function home(){setHead('单词王');const G=groups(),P=GP(),rs=load();
 app.innerHTML=`<div style="display:flex;gap:12px"><button class="big" style="flex:1" onclick="$('#cam').click()">📷 拍照</button><button class="big gray" style="flex:1" onclick="$('#gal').click()">🖼️ 相册</button></div>`+
 (G.length?'<h2>单词分组</h2>':'<p class="card">拍一页英文，自动整理单词。</p>')+
 '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">'+G.map((g,i)=>{const p=P[i],ok=p&&!p.w;return `<button onclick="go('study',{g:${i}})" style="min-height:76px;font-size:34px;font-weight:bold;border:none;border-radius:16px;color:#fff;background:${ok?'#1a9b4b':p?'#e07b00':'#1e6fd9'}">${i+1}</button>`}).join('')+'</div>'+
 (rs.length?`<button class="big gray" style="min-height:60px;font-size:24px" onclick="go('recs')">照片记录 (${rs.length})</button>`:'')}
function recs(){setHead('照片记录',1);const rs=load();
 app.innerHTML=rs.map((r,i)=>`<div class="card rec"><div class="info" onclick="go('detail',${i})"><b>${new Date(r.date).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</b><div class="d">单词 ${r.words.length}</div></div><button class="big green" style="width:110px;min-height:64px;margin:0" onclick="go('study',{i:${i}})">学习</button><button class="del" onclick="del(${i})">删</button></div>`).join('')||'<p class="card">无</p>'}
function del(i){if(!confirm('删除这条记录？'))return;const r=load();r.splice(i,1);save(r);recs()}
let CR=null,lastSrc='cam';
async function decode(f){try{return await createImageBitmap(f,{imageOrientation:'from-image'})}catch(_){}
 return new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>no(new Error('图片无法打开'));im.src=URL.createObjectURL(f)})}
async function onFile(e){lastSrc=e.target.id;const f=e.target.files[0];e.target.value='';if(!f)return;
 try{busy('请稍候…');const b=await decode(f);const W=b.width||b.naturalWidth,H=b.height||b.naturalHeight,m=4000,s=Math.min(1,m/Math.max(W,H));
  const c=document.createElement('canvas');c.width=Math.round(W*s);c.height=Math.round(H*s);c.getContext('2d').drawImage(b,0,0,c.width,c.height);if(b.close)b.close();
  busy();openCrop(c)}catch(err){busy();alert('出错了：'+err.message)}}
function openCrop(c){CR={src:c};$('#crop').style.display='flex';requestAnimationFrame(()=>requestAnimationFrame(()=>{if(CR)layoutCrop(true)}))}
function wrapSize(){const w=$('#cwrap'),bh=$('#cbar').offsetHeight||100;let W=w.clientWidth,H=w.clientHeight;
 if(!W||W>innerWidth)W=innerWidth;if(!H||H>innerHeight-bh)H=Math.max(100,innerHeight-bh);return[W,H]}
function layoutCrop(reset){const[WW,WH]=wrapSize(),c=CR.src,pad=40,cw=Math.max(40,WW-pad*2),ch=Math.max(40,WH-pad*2),s=Math.min(cw/c.width,ch/c.height);
 const dw=Math.floor(c.width*s),dh=Math.floor(c.height*s),cv=$('#cimg');CR.s=s;CR.ox=(WW-dw)/2;CR.oy=(WH-dh)/2;CR.dw=dw;CR.dh=dh;
 const k=Math.min(2,devicePixelRatio||1);cv.width=Math.round(dw*k);cv.height=Math.round(dh*k);cv.style.width=dw+'px';cv.style.height=dh+'px';cv.style.left=CR.ox+'px';cv.style.top=CR.oy+'px';
 cv.getContext('2d').drawImage(c,0,0,cv.width,cv.height);
 if(reset)CR.b={x:dw*.05,y:dh*.05,w:dw*.9,h:dh*.9};drawBox()}
function drawBox(){const b=CR.b,e=$('#cbox');e.style.left=CR.ox+b.x+'px';e.style.top=CR.oy+b.y+'px';e.style.width=b.w+'px';e.style.height=b.h+'px'}
(function(){const box=$('#cbox');let d=null;const MIN=60;
 box.addEventListener('pointerdown',e=>{e.preventDefault();box.setPointerCapture(e.pointerId);d={h:e.target.dataset.h||'move',x:e.clientX,y:e.clientY,b:{...CR.b}}});
 box.addEventListener('pointermove',e=>{if(!d)return;e.preventDefault();const dx=e.clientX-d.x,dy=e.clientY-d.y,o=d.b,W=CR.dw,H=CR.dh;let x1=o.x,y1=o.y,x2=o.x+o.w,y2=o.y+o.h;
  if(d.h==='move'){const nx=Math.max(0,Math.min(W-o.w,o.x+dx)),ny=Math.max(0,Math.min(H-o.h,o.y+dy));CR.b={x:nx,y:ny,w:o.w,h:o.h};return drawBox()}
  if(d.h[1]==='l')x1=Math.max(0,Math.min(x2-MIN,x1+dx));else x2=Math.min(W,Math.max(x1+MIN,x2+dx));
  if(d.h[0]==='t')y1=Math.max(0,Math.min(y2-MIN,y1+dy));else y2=Math.min(H,Math.max(y1+MIN,y2+dy));
  CR.b={x:x1,y:y1,w:x2-x1,h:y2-y1};drawBox()});
 const up=()=>{d=null};box.addEventListener('pointerup',up);box.addEventListener('pointercancel',up);
 addEventListener('resize',()=>{if(CR&&$('#crop').style.display==='flex'){const b=CR.b,s0=CR.dw;layoutCrop();const r=CR.dw/s0;CR.b={x:b.x*r,y:b.y*r,w:b.w*r,h:b.h*r};drawBox()}})})();
function closeCrop(){$('#crop').style.display='none'}
function cropBack(){closeCrop();CR=null;$('#'+lastSrc).click()}
function cropRot(){const c=CR.src,r=document.createElement('canvas');r.width=c.height;r.height=c.width;const x=r.getContext('2d');x.translate(r.width,0);x.rotate(Math.PI/2);x.drawImage(c,0,0);CR.src=r;layoutCrop(true)}
function cropRegion(full){const c=CR.src,s=CR.s,b=CR.b;let sx=0,sy=0,sw=c.width,sh=c.height;
 if(!full){sx=Math.round(b.x/s);sy=Math.round(b.y/s);sw=Math.min(c.width-sx,Math.round(b.w/s));sh=Math.min(c.height-sy,Math.round(b.h/s))}
 const m=2000,k=Math.min(1,m/Math.max(sw,sh)),o=document.createElement('canvas');o.width=Math.max(1,Math.round(sw*k));o.height=Math.max(1,Math.round(sh*k));
 o.getContext('2d').drawImage(c,sx,sy,sw,sh,0,0,o.width,o.height);return o}
function cropDone(full){const img=cropRegion(full);window._lastCrop=img;closeCrop();CR=null;runOCR(img)}
let DICTP=null;function loadDict(){return DICTP||(DICTP=Promise.all([fetch('words.txt').then(r=>r.ok?r.text():'').then(t=>{if(t)PE.setDict(t)}).catch(()=>{}),fetch('foreign.txt').then(r=>r.ok?r.text():'').then(t=>{if(t)PE.setForeign(t)}).catch(()=>{})]))}
let OW=null;async function ocrWorker(){if(!OW)OW=Tesseract.createWorker('eng',1,{logger:m=>{if(m.status==='recognizing text'&&OW_P)busy(OW_P+' '+Math.round(m.progress*100)+'%')}});return OW}
let OW_P='';
function rotCanvas(c,deg){const r=document.createElement('canvas');r.width=deg%180?c.height:c.width;r.height=deg%180?c.width:c.height;const x=r.getContext('2d');x.translate(r.width/2,r.height/2);x.rotate(deg*Math.PI/180);x.drawImage(c,-c.width/2,-c.height/2);return r}
function smallCanvas(c){const k=Math.min(1,1600/Math.max(c.width,c.height)),o=document.createElement('canvas');o.width=Math.round(c.width*k);o.height=Math.round(c.height*k);o.getContext('2d').drawImage(c,0,0,o.width,o.height);return o}
async function runOCR(img){
 try{busy('正在识别文字…');await loadDict();const w=await ocrWorker();
  const r=await PE.autoOCR(img,{rotate:rotCanvas,small:smallCanvas,progress:t=>{OW_P=t;busy(t)},recognize:async(i)=>(await w.recognize(i)).data});
  OW_P='';img=r.img;const text=r.text;const WI=PE.wordInfo(text),W=WI.map(w=>w.en);
  if(!W.length){busy();alert('没有找到清楚的英文，请靠近一点、对准文字再拍（也可以用 ⟳ 旋转）');return}
  busy('正在翻译…');let tr=[];
  try{tr=await PETranslate(W)}catch(_){}
  const rec={date:Date.now(),text,thumb:thumb(img),words:WI.map((w,i)=>({type:'word',en:w.en,proper:w.proper,zh:tr[i]||null}))};
  const rs=load();rs.unshift(rec);try{save(rs)}catch(_){rec.thumb='';save(rs)}bank();busy();go('detail',0)
 }catch(err){OW_P='';busy();alert('出错了：'+err.message)}}
function thumb(c){const t=document.createElement('canvas'),s=Math.min(1,400/c.width);t.width=Math.round(c.width*s);t.height=Math.round(c.height*s);t.getContext('2d').drawImage(c,0,0,t.width,t.height);return t.toDataURL('image/jpeg',.6)}
$('#cam').onchange=onFile;$('#gal').onchange=onFile;
function detail(i){const r=load()[i];setHead('学习记录',1);
 app.innerHTML=`<button class="big green" onclick="go('study',{i:${i}})">▶ 开始学习</button>
 <div class="card">${r.words.map(x=>rowH(x,`detail(${i})`)).join('')||'无'}</div>
 ${r.thumb?`<img class="prev" src="${r.thumb}">`:''}`}
const q=s=>esc(s).replace(/'/g,"\\'");
function rowH(x,re){const kn=isKnown(x.en);return `<div class="row rowf"><div onclick="say('${q(x.en)}')" style="${kn?'opacity:.5':''}">🔊 ${esc(x.en)}<br><span class="z">${x.zh?esc(x.zh):'<span class="na">（翻译暂不可用）</span>'}</span></div><button class="known${kn?' on':''}" onclick="setKnown('${q(x.en)}',${!kn});${re}">${kn?'恢复':'隐藏该词'}</button></div>`}
function say(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;const v=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-').startsWith('en-US'));if(v)u.voice=v;speechSynthesis.speak(u)}
let S;
function study(o){const{i,g}=o;let items=o.items;const rs=load();const all=Object.values(bank().w);let pool,base,title='学习';
 if(g!=null){const G=groups()[g]||[];title='第'+(g+1)+'组';pool=all;base=G.filter(x=>x.zh&&!isKnown(x.en))}
 else{const r=rs[i];pool=[...r.words,...all];base=r.words.filter(x=>x.zh&&!isKnown(x.en))}
 setHead(o.items?title+' · 错题再练':title,1);
 items=(items||base).filter(x=>!isKnown(x.en));
 if(!items.length){app.innerHTML='<p class="card">没有可学习的单词。</p><button class="big gray" onclick="go(\'home\')">回到分组</button>';return}
 S={o,items,pool,k:0,wrong:new Set(),title};show()}
function show(){const it=S.items[S.k];const w=PE.pickWrong(it,S.pool);
 const opts=w?(Math.random()<.5?[it.zh,w.zh]:[w.zh,it.zh]):[it.zh];
 app.innerHTML=`<div class="prog">${S.o.items?'错题再练 · ':''}${S.k+1} / ${S.items.length}</div>
 <div class="en">${esc(it.en)}</div><div style="position:relative;display:flex;justify-content:center;align-items:center"><button class="play" style="margin:10px 0" onclick="say(S.items[S.k].en)">🔊</button><button class="known" style="position:absolute;left:calc(50% + 76px);top:50%;transform:translateY(-50%);line-height:1.2;padding:10px 14px" onclick="setKnown(S.items[S.k].en,true);next()">隐藏<br>该词</button></div>
 ${opts.map(o=>`<button class="opt" data-ok="${o===it.zh?1:0}">${esc(o)}</button>`).join('')}<div class="msg" id="msg"></div>`;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b));say(it.en)}
function pick(b){const m=$('#msg');if(b.dataset.ok==='1'){b.classList.add('right');m.textContent='👍 答对了！';app.querySelectorAll('.opt').forEach(x=>x.onclick=null);
  setTimeout(next,900)}
 else{b.classList.add('wrong');if(!S.wrong.has(S.k)){S.wrong.add(S.k);addWrong(S.items[S.k])}m.textContent='💪 没关系，再试一次！';say(S.items[S.k].en)}}
function next(){S.k++;if(S.k<S.items.length)return show();end()}
function end(){const n=S.items.length,w=S.wrong.size,g=S.o.g;S.wrongItems=[...S.wrong].map(k=>S.items[k]).filter(x=>!isKnown(x.en));
 if(g!=null&&!S.o.items)setGP(g,{r:n-w,n,w});setHead(S.title+' · 完成',1);const ng=g!=null&&g+1<groups().length;
 app.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:60px">${w?'💪':'🎉'}</div><div class="en">${n-w} / ${n}</div><div style="font-size:28px">答对 ${n-w} · 答错 ${w}</div></div>
 ${S.wrongItems.length?`<button class="big orange" id="redo" onclick="redo()">错题再练</button>`:''}${ng?`<button class="big green" onclick="go('study',{g:${g+1}})">下一组</button>`:''}<button class="big gray" onclick="go('home')">回到分组</button>`}
function redo(){go('study',{...S.o,items:S.wrongItems})}
speechSynthesis.getVoices();bank();home();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').then(r=>r.update());
</script></body></html>
